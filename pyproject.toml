[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-recon-scanner"
version = "0.1.0"
description = "Authorized CTF recon scanner (enumeration only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "rich>=13.7.0",
  "streamlit>=1.35.0",
]

[project.scripts]
ctf-scanner = "ctf_scanner.cli:app"

[tool.setuptools.packages.find]
include = ["ctf_scanner*"]
